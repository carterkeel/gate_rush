name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create the Android project from the web build
        run: |
          mkdir www && cp dist/index.html www/index.html
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          python3 android-patch/patch.py
          npx cap sync android
      - name: Build signed release bundle for Google Play (only when signing secrets are set)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          python3 android-patch/sign.py
          cd android && ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../gate-rush.aab
      - name: Upload the release bundle
        if: hashFiles('gate-rush.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gate-rush-aab
          path: gate-rush.aab
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gate-rush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gate-rush-apk
          path: gate-rush.apk
      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Gate Rush APK (latest)" --notes "Debug-signed Android build of the latest main."
          gh release upload apk-latest gate-rush.apk --clobber
      - name: Publish a versioned release (tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp gate-rush.apk "gate-rush-${TAG}.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Gate Rush ${TAG#v}" --notes "Gate Rush: Multiply & Conquer ${TAG#v}. Android APK attached (debug-signed build for sideloading and testing; the Google Play version is the signed bundle)."
          gh release upload "$TAG" "gate-rush-${TAG}.apk" --clobber
